services:
  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root1234
    ports:
      - "15432:5432"
    volumes:
      - azentic-data:/var/lib/postgresql/data
    networks:
      - azentic-network
    labels:
      com.azentic.group: "azentic-group"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    depends_on:
      - keycloak-db
    restart: always
    command: [ "start-dev" ]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: malenquilla
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db/keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: root1234
      KC_HTTP_RELATIVE_PATH: /auth
    ports:
      - "8080:8080"
    networks:
      - azentic-network
    labels:
      com.azentic.group: "azentic-group"

volumes:
  azentic-data:

networks:
  azentic-network:
    name: azentic-net