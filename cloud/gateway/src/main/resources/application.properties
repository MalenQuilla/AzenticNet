spring.application.name=gateway

spring.config.import=configserver:http://localhost:8760/
spring.cloud.config.username=admin
spring.cloud.config.password=malenquilla

spring.cloud.config.name=gateway
spring.cloud.config.profile=default

# Keycloak Server URL
keycloak.auth-server-url=http://localhost:8080/

# Realm
keycloak.realm=master

# Client ID
keycloak.resource=test

# Client Credentials
keycloak.credentials.secret=GOjkzmRMWD8RUJCBYHilCOS6RsAXRygq

# Enable Policy Enforcer
# PERMISSIVE, ENFORCING, DISABLED
keycloak.policy-enforcer-config.enforcement-mode=ENFORCING
# Enable if you use UMA
# keycloak.policy-enforcer-config.user-managed-access=

# --- Paths Configuration ---
# This is where you map HTTP paths to resource names defined in Keycloak
# The adapter will use these to ask Keycloak for authorization decisions.
keycloak.policy-enforcer-config.paths[0].path=/data/*
keycloak.policy-enforcer-config.paths[0].name=Data Resource # Matches the 'name' of the resource in Keycloak
keycloak.policy-enforcer-config.paths[0].methods[0].method=GET
keycloak.policy-enforcer-config.paths[0].methods[0].scopes[0]=data:read # Optional: if you use scopes
keycloak.policy-enforcer-config.paths[0].methods[1].method=POST
keycloak.policy-enforcer-config.paths[0].methods[1].scopes[0]=data:write # Optional

keycloak.policy-enforcer-config.paths[1].path=/admin/resource
keycloak.policy-enforcer-config.paths[1].name=Admin Protected Resource
# keycloak.policy-enforcer-config.paths[1].enforcement-mode=DISABLED # You can override enforcement mode per path

# --- Lazy Load Paths ---
# If you have many paths or want to fetch them from Keycloak server (requires client 'View Authorization' permission)
# keycloak.policy-enforcer-config.lazy-load-paths=true

# --- Claim Information Point ---
# If your policies rely on claims not present in the standard token (e.g., from HTTP headers/query params)
# keycloak.policy-enforcer-config.claim-information-point.claims[custom_header_claim]={request.headers['X-Custom-Header']}
# keycloak.policy-enforcer-config.claim-information-point.claims[custom_query_param_claim]={request.parameters['customQuery']}


# Spring Security Settings (can influence Keycloak adapter)
spring.security.oauth2.client.provider.keycloak.issuer-uri=${keycloak.auth-server-url}/realms/${keycloak.realm}
spring.security.oauth2.client.registration.keycloak.client-id=${keycloak.resource}
spring.security.oauth2.client.registration.keycloak.client-secret=${keycloak.credentials.secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code # Or client_credentials
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId} # If using OAuth2 login

# For resource server JWT validation (often used alongside policy enforcer)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.auth-server-url}/realms/${keycloak.realm}
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs